name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        run: cargo test -p atlas-core

      - name: Build Atlas
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-windows
          path: |
            target/release/atlas.exe
            target/release/bundle/nsis/*.exe

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/atlas.exe
            target/release/bundle/nsis/*.exe

  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: microsoft

      - name: Build Atlas Cosmetics mod
        working-directory: mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-cosmetics-mod
          path: mod/build/libs/atlas-cosmetics-*.jar

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp mod/build/libs/atlas-cosmetics-${GITHUB_REF_NAME#v}.jar atlas-cosmetics.jar
          gh release upload "$GITHUB_REF_NAME" atlas-cosmetics.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
